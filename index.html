<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bleach Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }

  .quiz-container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ff6b35, #f7c548);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: #aaa;
    font-size: 0.9rem;
    margin-bottom: 30px;
  }

  .question {
    font-size: 1.15rem;
    line-height: 1.5;
    margin-bottom: 25px;
    color: #f0f0f0;
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .answer-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    padding: 16px 20px;
    border-radius: 12px;
    font-size: 1rem;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .answer-btn:hover:not(:disabled) {
    background: rgba(255, 107, 53, 0.2);
    border-color: #ff6b35;
    transform: translateX(5px);
  }

  .answer-btn:disabled {
    cursor: not-allowed;
  }

  .answer-btn.correct {
    background: rgba(46, 204, 113, 0.3);
    border-color: #2ecc71;
    color: #2ecc71;
  }

  .answer-btn.wrong {
    background: rgba(231, 76, 60, 0.3);
    border-color: #e74c3c;
    color: #e74c3c;
  }

  .result {
    margin-top: 25px;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .result.show { opacity: 1; }
  .result.correct { background: rgba(46, 204, 113, 0.15); color: #2ecc71; }
  .result.wrong { background: rgba(231, 76, 60, 0.15); color: #e74c3c; }
</style>
</head>
<body>
  <div class="quiz-container">
    <h1>Bleach Quiz</h1>
    <p class="subtitle">Test your Soul Reaper knowledge</p>

    <p class="question">How many times does Rukia appear on a Volume cover of the Bleach manga?</p>

    <div class="answers">
      <button class="answer-btn" data-correct="false">1</button>
      <button class="answer-btn" data-correct="false">4</button>
      <button class="answer-btn" data-correct="false">2</button>
      <button class="answer-btn" data-correct="true">3</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <script>
    const buttons = document.querySelectorAll('.answer-btn');
    const result = document.getElementById('result');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const isCorrect = btn.dataset.correct === 'true';

        buttons.forEach(b => {
          b.disabled = true;
          if (b.dataset.correct === 'true') b.classList.add('correct');
        });

        if (!isCorrect) btn.classList.add('wrong');

        result.textContent = isCorrect ? '✅ Correct! Nice one.' : '❌ Wrong! The answer was 3.';
        result.className = 'result show ' + (isCorrect ? 'correct' : 'wrong');
      });
    });
  </script>
</body>
</html>
