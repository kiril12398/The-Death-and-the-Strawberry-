<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bleach Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: linear-gradient(135deg, #e8ecf1 0%, #c9d4e0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #1a2332;
  }

  .quiz-container {
    background: #fdfdfd;
    border: 3px solid #1e3a5f;
    border-radius: 4px;
    padding: 45px 50px 25px;
    max-width: 680px;
    width: 100%;
    box-shadow:
      0 0 0 1px #fdfdfd,
      0 0 0 4px #1e3a5f,
      0 20px 50px rgba(30, 58, 95, 0.25);
    position: relative;
  }

  .quiz-container::before {
    content: "";
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px solid rgba(30, 58, 95, 0.2);
    border-radius: 2px;
    pointer-events: none;
  }

  /* ===== Logo ===== */
  .logo-wrap {
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }
  .logo-img {
    max-height: 70px;
    max-width: 100%;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
    position: relative;
    z-index: 1;
  }

  h1 {
    font-family: Georgia, serif;
    font-size: 1.9rem;
    font-weight: 700;
    color: #1e3a5f;
    letter-spacing: 0.5px;
  }

  .counter {
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    color: #8a94a6;
    white-space: nowrap;
    font-weight: 700;
  }

  .subtitle {
    font-family: Georgia, serif;
    font-style: italic;
    color: #6b7a8f;
    font-size: 0.9rem;
    margin-bottom: 22px;
    position: relative;
    z-index: 1;
  }

  .divider {
    height: 2px;
    background: linear-gradient(90deg, transparent, #1e3a5f 20%, #1e3a5f 80%, transparent);
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }
  .divider-red {
    height: 2px;
    background: linear-gradient(90deg, transparent, #c0392b 30%, #c0392b 70%, transparent);
    margin-bottom: 26px;
    position: relative;
    z-index: 1;
  }

  .progress-bar {
    height: 4px;
    background: #e1e6ed;
    overflow: hidden;
    margin-bottom: 30px;
    position: relative;
    z-index: 1;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #1e3a5f, #c0392b);
    width: 0%;
    transition: width 0.4s ease;
  }

  .question-image {
    display: block;
    max-width: 100%;
    max-height: 300px;
    margin: 0 auto 22px;
    border: 2px solid #1e3a5f;
    padding: 4px;
    background: #fdfdfd;
    position: relative;
    z-index: 1;
  }

  .audio-wrap {
    margin: 0 auto 24px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .audio-play-btn {
    background: #1e3a5f;
    color: #fdfdfd;
    border: 2px solid #1e3a5f;
    padding: 16px 40px;
    border-radius: 3px;
    font-family: Georgia, serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .audio-play-btn:hover { background: #c0392b; border-color: #c0392b; }
  .audio-play-btn.playing { background: #c0392b; border-color: #c0392b; }
  .audio-play-btn .icon { font-size: 1.2rem; }

  .question {
    font-family: Georgia, serif;
    font-size: 1.15rem;
    line-height: 1.6;
    margin-bottom: 26px;
    color: #1a2332;
    position: relative;
    z-index: 1;
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    z-index: 1;
  }

  .answer-btn {
    background: #f4f7fa;
    border: 2px solid #c8d2de;
    color: #1a2332;
    padding: 15px 22px;
    border-radius: 3px;
    font-size: 1rem;
    text-align: left;
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: Georgia, serif;
  }
  .answer-btn:hover:not(:disabled) {
    background: #fff;
    border-color: #c0392b;
    box-shadow: 0 3px 10px rgba(192, 57, 43, 0.15);
    transform: translateX(4px);
  }
  .answer-btn:disabled { cursor: not-allowed; }
  .answer-btn.correct {
    background: #e8f5ec;
    border-color: #2e7d4f;
    color: #1e5c37;
    font-weight: 700;
  }
  .answer-btn.wrong {
    background: #fbeae8;
    border-color: #c0392b;
    color: #a02d20;
  }

  .text-input-row {
    display: flex;
    gap: 10px;
    position: relative;
    z-index: 1;
  }
  .text-input {
    flex: 1;
    background: #f4f7fa;
    border: 2px solid #c8d2de;
    color: #1a2332;
    padding: 15px 20px;
    border-radius: 3px;
    font-size: 1rem;
    font-family: Georgia, serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .text-input:focus { border-color: #c0392b; background: #fff; }
  .text-input:disabled { opacity: 0.6; cursor: not-allowed; }

  .submit-btn {
    background: #1e3a5f;
    border: 2px solid #1e3a5f;
    color: #fdfdfd;
    padding: 15px 30px;
    border-radius: 3px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: Georgia, serif;
    letter-spacing: 0.5px;
    transition: all 0.18s;
  }
  .submit-btn:hover:not(:disabled) { background: #c0392b; border-color: #c0392b; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .result {
    margin-top: 22px;
    padding: 16px;
    text-align: center;
    font-weight: 700;
    font-family: Georgia, serif;
    display: none;
    position: relative;
    z-index: 1;
    border-left: 4px solid;
  }
  .result.show { display: block; }
  .result.correct { background: #e8f5ec; color: #1e5c37; border-color: #2e7d4f; }
  .result.wrong { background: #fbeae8; color: #a02d20; border-color: #c0392b; }

  .next-btn {
    margin-top: 22px;
    width: 100%;
    background: #c0392b;
    border: 2px solid #c0392b;
    color: #fdfdfd;
    padding: 16px;
    border-radius: 3px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: Georgia, serif;
    letter-spacing: 1px;
    display: none;
    transition: all 0.18s;
    position: relative;
    z-index: 1;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { background: #1e3a5f; border-color: #1e3a5f; }

  /* ===== Dev skip button ===== */
  .dev-skip {
    margin-top: 18px;
    text-align: right;
    position: relative;
    z-index: 1;
  }
  .dev-skip button {
    background: transparent;
    border: 1px dashed #8a94a6;
    color: #8a94a6;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    padding: 6px 12px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.18s;
  }
  .dev-skip button:hover {
    border-color: #c0392b;
    color: #c0392b;
    border-style: solid;
  }

  .final-screen {
    text-align: center;
    padding: 25px 0;
    position: relative;
    z-index: 1;
  }
  .final-score {
    font-family: Georgia, serif;
    font-size: 4rem;
    font-weight: 700;
    color: #c0392b;
    margin: 10px 0;
    letter-spacing: 2px;
  }
  .final-msg {
    font-family: Georgia, serif;
    font-style: italic;
    color: #4a5568;
    margin-bottom: 30px;
    font-size: 1.05rem;
  }

  .restart-btn {
    background: #1e3a5f;
    border: 2px solid #1e3a5f;
    color: #fdfdfd;
    padding: 16px 45px;
    border-radius: 3px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: Georgia, serif;
    letter-spacing: 1px;
    transition: all 0.18s;
  }
  .restart-btn:hover { background: #c0392b; border-color: #c0392b; }
</style>
</head>
<body>
  <div class="quiz-container" id="quiz"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const LOGO_PATH = "images/logo.png";  // ← Bleach logo (set to null to hide)

/* ============================================================
   QUIZ DATA
   ============================================================ */
const QUESTIONS = [
  { type: "mc",
    question: "How old was Ichigo at the start of the series?",
    answers: ["16", "18", "17", "15"], correct: "15" },

  { type: "mc",
    question: "What was the name of Uryū's grandfather and master?",
    answers: ["Shūsuke", "Jin", "Sōken", "Muramasa"], correct: "Sōken" },

  { type: "tf",
    question: "The Hōgyoku is often associated with Aizen, but in fact, Kisuke was the one to create the Complete Hōgyoku.",
    correct: false },

  { type: "mc",
    question: "Which of these Bankai is canonically the first and oldest to exist in the series?",
    answers: ["Shatatsu Karagara Shigarami no Tsuji", "Katen Kyōkotsu: Karamatsu Shinjū", "Zanka no Tachi", "Shin'uchi: Shirafude Ichimonji"],
    correct: "Shin'uchi: Shirafude Ichimonji" },

  { type: "mc",
    question: "Who was the first squad captain of the Gotei 13 that Ichigo encountered after they entered Soul Society?",
    answers: ["Byakuya Kuchiki", "Gin Ichimaru", "Kenpachi Zaraki", "Aizen Sōsuke"],
    correct: "Gin Ichimaru" },

  { type: "open",
    question: "During Aizen's sentencing following his defeat, he taunted members of Central 46 and consequently got his sentence increased to 20,000 years. What was the original number of years he was given?",
    accepted: ["18,800", "18800"] },

  { type: "open",
    image: "images/jugram-angry.jpg",
    question: "Make Jugram happy and spell his family name correctly.",
    accepted: ["Haschwalth", "haschwalth"] },

  { type: "mc",
    question: "Before Kenpachi Zaraki became the captain of Squad 11, how many previous Kenpachi had there been?",
    answers: ["10", "11", "8", "9"], correct: "10" },

  { type: "mc",
    question: "What was the name of Rukia's sister?",
    answers: ["Riruka", "Nozomi", "Senna", "Hisana"], correct: "Hisana" },

  { type: "mc",
    question: "Who created the Shinigami Research and Development Institute?",
    answers: ["Mayuri", "Kisuke", "Aizen", "Senjumaru"], correct: "Kisuke" },

  { type: "mc",
    audio: "images/cero.mp3",
    question: "Which of these Arrancar techniques produces this sound?",
    answers: ["Sonido", "Hierro", "Cero", "Bala"], correct: "Cero" },

  { type: "mc",
    question: "Which of these Squad 0 members got promoted from a captain during the events in the manga/anime?",
    answers: ["Kirio Hikifune", "Senjumaru Shutara", "Oetsu Nimaiya", "Tenjiro Kirinji"],
    correct: "Kirio Hikifune" }
];

/* ============================================================
   ENGINE
   ============================================================ */
function normalize(str) {
  return String(str).toLowerCase().replace(/[,\.\s\-'’]/g, "").trim();
}

const quizEl = document.getElementById("quiz");
let currentIndex = 0;
let score = 0;
let locked = false;
let currentAudio = null;

function renderQuestion() {
  locked = false;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }

  const q = QUESTIONS[currentIndex];
  const total = QUESTIONS.length;
  const progressPct = (currentIndex / total) * 100;

  let answersHTML = "";
  if (q.type === "mc" || q.type === "tf") {
    const choices = q.type === "tf" ? [true, false] : q.answers;
    answersHTML = `<div class="answers">` +
      choices.map((c, i) => {
        const label = q.type === "tf" ? (c ? "True" : "False") : c;
        const dataVal = q.type === "tf" ? String(c) : c;
        return `<button class="answer-btn" data-idx="${i}" data-val="${escapeAttr(dataVal)}">${escapeHTML(label)}</button>`;
      }).join("") + `</div>`;
  } else if (q.type === "open") {
    answersHTML = `
      <div class="text-input-row">
        <input type="text" class="text-input" id="openInput" placeholder="Type your answer..." autocomplete="off">
        <button class="submit-btn" id="submitOpen">Submit</button>
      </div>`;
  }

  const imageHTML = q.image
    ? `<img src="${escapeAttr(q.image)}" alt="" class="question-image" onerror="this.style.display='none'">` : "";

  const audioHTML = q.audio
    ? `<div class="audio-wrap">
         <button class="audio-play-btn" id="audioPlay">
           <span class="icon">🔊</span><span id="audioLabel">PLAY AUDIO</span>
         </button>
       </div>` : "";

  const logoHTML = LOGO_PATH
    ? `<div class="logo-wrap"><img src="${escapeAttr(LOGO_PATH)}" alt="Bleach" class="logo-img" onerror="this.parentElement.style.display='none'"></div>`
    : "";

  quizEl.innerHTML = `
    ${logoHTML}
    <div class="header">
      <h1>Bleach Quiz</h1>
      <span class="counter">${currentIndex + 1} / ${total}</span>
    </div>
    <p class="subtitle">Test your Soul Reaper knowledge</p>
    <div class="divider"></div>
    <div class="divider-red"></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    ${imageHTML}
    ${audioHTML}
    <p class="question">${escapeHTML(q.question)}</p>
    ${answersHTML}
    <div class="result" id="result"></div>
    <button class="next-btn" id="nextBtn">NEXT →</button>
    <div class="dev-skip"><button id="devSkip">⚙ DEV: SKIP →</button></div>
  `;

  if (q.type === "mc" || q.type === "tf") {
    quizEl.querySelectorAll(".answer-btn").forEach(btn => {
      btn.addEventListener("click", () => handleChoice(btn, q));
    });
  }

  if (q.type === "open") {
    const input = document.getElementById("openInput");
    const submit = document.getElementById("submitOpen");
    submit.addEventListener("click", () => handleOpen(input, q));
    input.addEventListener("keydown", e => { if (e.key === "Enter") handleOpen(input, q); });
    input.focus();
  }

  if (q.audio) {
    const playBtn = document.getElementById("audioPlay");
    const label = document.getElementById("audioLabel");
    currentAudio = new Audio(q.audio);
    currentAudio.addEventListener("ended", () => {
      playBtn.classList.remove("playing");
      label.textContent = "PLAY AUDIO";
    });
    playBtn.addEventListener("click", () => {
      if (currentAudio.paused) {
        currentAudio.currentTime = 0;
        currentAudio.play();
        playBtn.classList.add("playing");
        label.textContent = "PLAYING...";
      } else {
        currentAudio.pause();
        playBtn.classList.remove("playing");
        label.textContent = "PLAY AUDIO";
      }
    });
  }

  document.getElementById("nextBtn").addEventListener("click", nextQuestion);
  document.getElementById("devSkip").addEventListener("click", devSkip);
}

function handleChoice(btn, q) {
  if (locked) return;
  locked = true;

  const chosen = btn.dataset.val;
  const correctVal = q.type === "tf" ? String(q.correct) : q.correct;
  const isCorrect = (chosen === correctVal);

  quizEl.querySelectorAll(".answer-btn").forEach(b => {
    b.disabled = true;
    if (b.dataset.val === correctVal) b.classList.add("correct");
  });

  if (!isCorrect) btn.classList.add("wrong");
  if (isCorrect) score++;
  showResult(isCorrect, q);
}

function handleOpen(input, q) {
  if (locked) return;
  const raw = input.value.trim();
  if (raw === "") return;

  locked = true;
  input.disabled = true;
  document.getElementById("submitOpen").disabled = true;

  const userNorm = normalize(raw);
  const isCorrect = q.accepted.some(a => normalize(a) === userNorm);

  if (isCorrect) score++;
  showResult(isCorrect, q, raw);
}

function showResult(isCorrect, q) {
  const result = document.getElementById("result");
  result.classList.add("show", isCorrect ? "correct" : "wrong");

  if (isCorrect) {
    result.textContent = "✓ Correct!";
  } else {
    let correctText = "";
    if (q.type === "tf") correctText = q.correct ? "True" : "False";
    else if (q.type === "mc") correctText = q.correct;
    else if (q.type === "open") correctText = q.accepted[0];
    result.textContent = `✗ Wrong — correct answer: ${correctText}`;
  }

  document.getElementById("nextBtn").classList.add("show");
}

function nextQuestion() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  currentIndex++;
  if (currentIndex >= QUESTIONS.length) renderFinal();
  else renderQuestion();
}

/* Dev skip: advances without scoring, no feedback */
function devSkip() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  currentIndex++;
  if (currentIndex >= QUESTIONS.length) renderFinal();
  else renderQuestion();
}

function renderFinal() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const total = QUESTIONS.length;
  const pct = Math.round((score / total) * 100);
  let msg = "";
  if (pct === 100) msg = "Perfect score. A true Captain of the Gotei 13.";
  else if (pct >= 80) msg = "Excellent — Lieutenant-level knowledge.";
  else if (pct >= 60) msg = "Not bad. You've earned your seated position.";
  else if (pct >= 40) msg = "Keep training at the Shin'ō Academy.";
  else msg = "Back to the academy for you.";

  const logoHTML = LOGO_PATH
    ? `<div class="logo-wrap"><img src="${escapeAttr(LOGO_PATH)}" alt="Bleach" class="logo-img" onerror="this.parentElement.style.display='none'"></div>`
    : "";

  quizEl.innerHTML = `
    <div class="final-screen">
      ${logoHTML}
      <h1>Quiz Complete</h1>
      <div class="divider"></div>
      <div class="divider-red"></div>
      <div class="final-score">${score} / ${total}</div>
      <p class="final-msg">${msg}</p>
      <button class="restart-btn" id="restartBtn">TRY AGAIN</button>
      <div class="dev-skip"><button id="devSkip">⚙ DEV: SKIP →</button></div>
    </div>
  `;
  document.getElementById("restartBtn").addEventListener("click", () => {
    currentIndex = 0; score = 0; renderQuestion();
  });
  document.getElementById("devSkip").addEventListener("click", devSkip);
}

function escapeHTML(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escapeAttr(str) {
  return String(str).replace(/"/g, "&quot;");
}

renderQuestion();
</script>
</body>
</html>
